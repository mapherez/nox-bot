# Offline lifecycle smoke only. No deployment .env, actual login or publishing.
services:
  shutdown:
    image: ${NOX_BOT_TEST_IMAGE:-nox-bot:validation-arm64}
    platform: ${NOX_BOT_TEST_PLATFORM:-linux/arm64}
    entrypoint: ["node", "/app/tests/fixtures/docker-shutdown.mjs"]
    volumes:
      - type: bind
        source: .
        target: /app/tests
        read_only: true
    stop_grace_period: 15s
