# Offline lifecycle smoke test; never reads the deployment .env or logs into Discord.
services:
  shutdown:
    image: nox-discord-bot:control-api-smoke
    platform: linux/arm64
    entrypoint: ["node", "/app/tests/fixtures/docker-shutdown.mjs"]
    volumes:
      - type: bind
        source: .
        target: /app/tests
        read_only: true
    stop_grace_period: 15s
