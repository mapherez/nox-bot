name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-bot-ci-${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'nox-bot-Release:') && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select CI work
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Recognize a version-only release request
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mode=full
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            mode=$(node scripts/ci-policy.mjs classify "$GITHUB_SHA")
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  policy:
    name: CI reuse policy tests
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - run: node --test scripts/ci-policy.test.mjs scripts/release.test.mjs

  test:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - name: Install native build tooling
        run: sudo apt-get update && sudo apt-get install -y python3 make g++ pkg-config libhunspell-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:code
      - run: npm test

  container:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: SQLite image and volume (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build production image without publishing
        run: docker buildx build --platform linux/${{ matrix.arch }} --load -t nox-bot:validation-${{ matrix.arch }} .
      - name: Verify unprivileged SQLite initialization and volume persistence
        run: node scripts/test-compose.mjs ${{ matrix.arch }}
      - name: Verify existing bot startup and native dependencies
        run: |
          for mode in enabled disabled; do
            docker run --rm --platform linux/${{ matrix.arch }} --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint node nox-bot:validation-${{ matrix.arch }} /app/tests/fixtures/docker-smoke.mjs "$mode"
          done

  approved:
    name: CI approved
    needs: [plan, policy, test, container]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every source gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1)'
