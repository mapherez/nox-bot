name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install native build tooling
        run: sudo apt-get update && sudo apt-get install -y python3 make g++ pkg-config libhunspell-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  container:
    name: SQLite image and volume (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build production image without publishing
        run: docker buildx build --platform linux/${{ matrix.arch }} --load -t nox-bot:validation-${{ matrix.arch }} .
      - name: Verify unprivileged SQLite initialization and volume persistence
        run: node scripts/test-compose.mjs ${{ matrix.arch }}
      - name: Verify existing bot startup and native dependencies
        run: |
          for mode in enabled disabled; do
            docker run --rm --platform linux/${{ matrix.arch }} --mount "type=bind,source=$PWD/tests,target=/app/tests,readonly" --entrypoint node nox-bot:validation-${{ matrix.arch }} /app/tests/fixtures/docker-smoke.mjs "$mode"
          done
