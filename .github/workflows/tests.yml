name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install native build tooling
        run: sudo apt-get update && sudo apt-get install -y python3 make g++ pkg-config libhunspell-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:state
