name: Build Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag to publish
        required: true
        default: latest
      push_latest:
        description: Also push the latest tag
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  approval:
    name: Reuse approved source CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.ci.outputs.source_sha }}
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Require successful CI for the exact source
        id: ci
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { requireApprovedCI } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-policy.mjs`).href);
            const tag = context.ref.startsWith('refs/tags/') ? context.ref.slice('refs/tags/'.length) : '';

            const approval = await requireApprovedCI({ github, ...context.repo, revision: context.sha, tag });
            core.setOutput('source_sha', approval.sourceSha);
            core.setOutput('ci_run_id', String(approval.runId));
            core.notice(`Reusing source CI ${approval.runId} (${approval.sourceSha}); no source checks are repeated.`);

  build:
    needs: approval
    name: Build and push multiarch image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1

      - name: Resolve application version from published commit
        id: version
        run: echo "version=$(node scripts/resolve-build-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/amd64
          build-args: |
            NOX_BOT_BUILD_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
