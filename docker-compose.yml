services:
  nox-bot:
    image: ghcr.io/mapherez/nox-bot:${NOX_BOT_IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      NOX_BOT_DASHBOARD_HOST: 0.0.0.0
      NOX_BOT_DASHBOARD_PORT: "3200"
    volumes:
      - bot-data:/app/data
    ports: ["${NOX_BOT_DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${NOX_BOT_DASHBOARD_PORT:-3200}:3200"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3200/health', { signal: AbortSignal.timeout(4000) }).then(response => process.exit(response.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    stop_grace_period: 15s

volumes:
  bot-data:
